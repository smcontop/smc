name: Build Fire TV launcher APK

on:
  push:
    branches: [main]
    tags: ['launcher-v*']
    paths: ['fire-tv-launcher/**', '.github/workflows/fire-tv-launcher.yml']
  pull_request:
    paths: ['fire-tv-launcher/**', '.github/workflows/fire-tv-launcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: fire-tv-launcher
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK comes preinstalled on ubuntu-latest (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key so new builds install over old ones.
      # Add repo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          FL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease lint --console=plain

      - run: cp app/build/outputs/apk/release/app-release.apk FastLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FastLauncher
          path: fire-tv-launcher/FastLauncher.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        uses: softprops/action-gh-release@v2
        with:
          files: fire-tv-launcher/FastLauncher.apk
