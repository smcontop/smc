<title>Flip Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #f4f6f5;
    --surface: #ffffff;
    --surface-sunk: #eceff0;
    --ink: #101a18;
    --ink-soft: #3d4d49;
    --muted: #5b6b67;
    --line: #d8e0dd;
    --line-strong: #b9c6c2;
    --signal: #0f7a52;
    --signal-soft: #e2f1ea;
    --warn: #a8620a;
    --warn-soft: #f8eddc;
    --critical: #a32d24;
    --gpu: #1f5d8c;
    --cpu: #6b3f9e;
    --ram: #0b6b62;
    --kind-ink: #ffffff;
    --shadow: 0 1px 2px rgba(16, 26, 24, .06), 0 8px 24px -16px rgba(16, 26, 24, .35);
    --radius: 10px;
    --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0d1412;
      --surface: #141d1a;
      --surface-sunk: #101815;
      --ink: #e6eeea;
      --ink-soft: #c2d1cb;
      --muted: #8fa39d;
      --line: #24322e;
      --line-strong: #35463f;
      --signal: #3ddc97;
      --signal-soft: #14312a;
      --warn: #e0a458;
      --warn-soft: #33270f;
      --critical: #e5675c;
      --gpu: #6fb6e8;
      --cpu: #b795ea;
      --ram: #4fc7b8;
      --kind-ink: #08100e;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0d1412;
    --surface: #141d1a;
    --surface-sunk: #101815;
    --ink: #e6eeea;
    --ink-soft: #c2d1cb;
    --muted: #8fa39d;
    --line: #24322e;
    --line-strong: #35463f;
    --signal: #3ddc97;
    --signal-soft: #14312a;
    --warn: #e0a458;
    --warn-soft: #33270f;
    --critical: #e5675c;
    --gpu: #6fb6e8;
    --cpu: #b795ea;
    --ram: #4fc7b8;
    --kind-ink: #08100e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 0 56px;
  }

  /* ---------- masthead ---------- */

  header.masthead {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }

  .masthead-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-right: auto;
  }

  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .brand .count {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--signal);
    background: var(--signal-soft);
    border-radius: 999px;
    padding: 2px 8px;
  }

  .scan-state {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--signal);
    flex: none;
  }

  .pulse[data-stale="true"] { background: var(--warn); }
  .pulse[data-stale="offline"] { background: var(--line-strong); }

  /* ---------- rules strip ---------- */

  .rules {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding-block: 14px 0;
  }

  .rule {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 9px;
    white-space: nowrap;
  }

  .rule b { color: var(--ink); font-weight: 600; }

  /* ---------- controls ---------- */

  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding-block: 14px 18px;
  }

  .seg {
    display: flex;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }

  .seg button {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    min-height: 34px;
  }

  .seg button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }

  select, .ghost-btn {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 11px;
    min-height: 36px;
    cursor: pointer;
  }

  .ghost-btn:hover, select:hover { border-color: var(--line-strong); }

  .spacer { margin-left: auto; }

  :is(button, select, a):focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  /* ---------- deal grid ---------- */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 14px;
  }

  .deal {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .deal[data-dismissed="true"] { opacity: .45; }

  .deal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
  }

  .kind {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
    color: var(--kind-ink);
  }

  .kind[data-type="gpu"] { background: var(--gpu); }
  .kind[data-type="cpu"] { background: var(--cpu); }
  .kind[data-type="ram"] { background: var(--ram); }

  .model {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .units {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .deal-body { padding: 13px 14px 14px; display: flex; flex-direction: column; gap: 12px; flex: 1; }

  .title {
    margin: 0;
    font-size: 13.5px;
    font-weight: 400;
    color: var(--ink-soft);
    line-height: 1.35;
    min-height: 2.7em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .figures {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
  }

  .profit .value {
    font-family: var(--mono);
    font-size: 25px;
    font-weight: 600;
    color: var(--signal);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .roi {
    text-align: right;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* buy-vs-market bar: the discount, drawn to scale */
  .bar-block { display: flex; flex-direction: column; gap: 5px; }

  .bar {
    position: relative;
    height: 7px;
    border-radius: 4px;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .bar-fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--signal);
    opacity: .85;
  }

  .bar-legend {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  .bar-legend b { color: var(--ink); font-weight: 600; }

  .facts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px 12px;
    padding-top: 2px;
    border-top: 1px solid var(--line);
  }

  .fact { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .fact dt { color: var(--muted); }
  .fact dd {
    margin: 0;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }

  .flags { display: flex; flex-wrap: wrap; gap: 5px; }

  .flag {
    font-size: 11.5px;
    padding: 3px 8px;
    border-radius: 5px;
    background: var(--warn-soft);
    color: var(--warn);
    border: 1px solid color-mix(in srgb, var(--warn) 28%, transparent);
  }

  .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 2px; }

  .open-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    color: var(--ground);
    background: var(--ink);
    border-radius: 8px;
  }

  .open-btn:hover { background: var(--ink-soft); }

  .dismiss-btn { min-height: 42px; padding-inline: 14px; }

  /* ---------- states ---------- */

  .state {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 22px;
    text-align: center;
    max-width: 560px;
    margin: 24px auto;
  }

  .state h2 { margin: 0 0 8px; font-size: 17px; }
  .state p { margin: 0 auto 14px; color: var(--muted); font-size: 13.5px; max-width: 46ch; }
  .state code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 6px;
  }

  .state-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

  .sample-note {
    display: none;
    align-items: center;
    gap: 8px;
    margin-block: 14px 0;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--warn-soft);
    color: var(--warn);
    border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
    font-size: 12.5px;
  }

  .sample-note[data-on="true"] { display: flex; }

  footer.note {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 16px; }
    .controls { gap: 6px; }
    .seg button { padding: 6px 10px; }
    .profit .value { font-size: 23px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <h1>Flip Scanner</h1>
      <span class="count" id="count">0</span>
    </div>
    <div class="scan-state">
      <span class="pulse" id="pulse"></span>
      <span id="scan-time">connecting…</span>
    </div>
    <button class="ghost-btn" id="theme-btn" type="button" aria-label="Switch theme">Theme</button>
  </div>
</header>

<div class="wrap">
  <div class="rules" id="rules"></div>

  <div class="sample-note" id="sample-note" data-on="false">
    <span>Showing example listings so you can see the layout — not live eBay data.</span>
  </div>

  <div class="controls">
    <div class="seg" id="type-filter" role="group" aria-label="Filter by part type">
      <button type="button" data-type="all" aria-pressed="true">All</button>
      <button type="button" data-type="gpu" aria-pressed="false">GPU</button>
      <button type="button" data-type="cpu" aria-pressed="false">CPU</button>
      <button type="button" data-type="ram" aria-pressed="false">RAM</button>
    </div>

    <select id="sort" aria-label="Sort deals by">
      <option value="profit">Most profit</option>
      <option value="roi">Best ROI</option>
      <option value="discount">Biggest discount</option>
      <option value="found">Newest find</option>
      <option value="spend">Lowest spend</option>
    </select>

    <button class="ghost-btn" id="show-dismissed" type="button" aria-pressed="false">Show hidden</button>
    <button class="ghost-btn spacer" id="load-btn" type="button">Load deals.json</button>
    <input type="file" id="file-input" accept="application/json,.json" hidden>
  </div>

  <div id="grid" class="grid"></div>
  <div id="state-slot"></div>

  <footer class="note">
    Market value is the median asking price of comparable active listings, not sold prices — profit is an
    optimistic ceiling. Check eBay's sold listings before you buy.
  </footer>
</div>

<script>
  (function () {
    'use strict';

    const RULES = [
      ['Spend', '$300+'],
      ['Under market', '30%+'],
      ['Seller', '90%+ positive'],
      ['No-feedback sellers', 'excluded'],
      ['RAM', 'desktop only'],
    ];

    const state = {
      deals: [],
      dismissed: {},
      lastScanAt: null,
      live: false,
      sample: false,
      type: 'all',
      sort: 'profit',
      showDismissed: false,
    };

    const $ = (id) => document.getElementById(id);
    const money = (n) => '$' + Number(n ?? 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const pct = (n) => Math.round(Number(n ?? 0) * 100) + '%';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function ago(ts) {
      if (!ts) return 'no scan yet';
      const mins = Math.round((Date.now() - ts) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.round(hrs / 24) + 'd ago';
    }

    // ---- theme -------------------------------------------------------------

    try {
      const saved = localStorage.getItem('flip-theme');
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) { /* private mode */ }

    $('theme-btn').addEventListener('click', () => {
      const root = document.documentElement;
      const isDark = root.dataset.theme
        ? root.dataset.theme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = isDark ? 'light' : 'dark';
      try { localStorage.setItem('flip-theme', root.dataset.theme); } catch (e) { /* ignore */ }
    });

    // ---- data --------------------------------------------------------------

    async function loadLive() {
      const res = await fetch('api/deals', { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('api ' + res.status);
      const data = await res.json();
      state.deals = data.deals || [];
      state.dismissed = data.dismissed || {};
      state.lastScanAt = data.lastScanAt || null;
      state.live = true;
      state.sample = false;
    }

    function adoptFile(data) {
      state.deals = Array.isArray(data) ? data : (data.deals || []);
      state.lastScanAt = (data && data.lastScanAt) || null;
      state.live = false;
      state.sample = false;
      try {
        state.dismissed = JSON.parse(localStorage.getItem('flip-dismissed') || '{}');
      } catch (e) { state.dismissed = {}; }
      render();
    }

    async function setDismissed(id, value) {
      state.dismissed = { ...state.dismissed };
      if (value) state.dismissed[id] = Date.now();
      else delete state.dismissed[id];

      if (state.live) {
        try {
          await fetch('api/dismiss', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, dismissed: value }),
          });
        } catch (e) { /* the list still updates locally */ }
      } else {
        try { localStorage.setItem('flip-dismissed', JSON.stringify(state.dismissed)); } catch (e) { /* ignore */ }
      }
      render();
    }

    // ---- render ------------------------------------------------------------

    function visibleDeals() {
      let list = state.deals.slice();
      if (state.type !== 'all') list = list.filter((d) => d.identity.type === state.type);
      if (!state.showDismissed) list = list.filter((d) => !state.dismissed[d.id]);

      const by = {
        profit: (a, b) => b.score.profit - a.score.profit,
        roi: (a, b) => b.score.roi - a.score.roi,
        discount: (a, b) => b.score.discount - a.score.discount,
        found: (a, b) => (b.foundAt || 0) - (a.foundAt || 0),
        spend: (a, b) => a.score.investment - b.score.investment,
      };
      return list.sort(by[state.sort] || by.profit);
    }

    function dealCard(deal) {
      const { listing, identity, score } = deal;
      const dismissed = Boolean(state.dismissed[deal.id]);
      const units = [];
      if (score.lotSize > 1) units.push('lot of ' + score.lotSize);
      if (score.quantityAvailable > 1) units.push(score.quantityAvailable + ' in stock');

      // The fill shows what you pay as a share of market value.
      const paidShare = Math.max(4, Math.min(100, Math.round((score.buyPrice / score.market) * 100)));
      const seller = listing.seller || {};

      const el = document.createElement('article');
      el.className = 'deal';
      el.dataset.dismissed = String(dismissed);
      el.innerHTML =
        '<div class="deal-head">' +
          '<span class="kind" data-type="' + esc(identity.type) + '">' + esc(identity.type) + '</span>' +
          '<span class="model">' + esc(identity.model.replace(/\|/g, ' · ')) + '</span>' +
          (units.length ? '<span class="units">' + esc(units.join(' · ')) + '</span>' : '') +
        '</div>' +
        '<div class="deal-body">' +
          '<p class="title">' + esc(listing.title) + '</p>' +
          '<div class="figures">' +
            '<div class="profit">' +
              '<div class="label">Est. profit</div>' +
              '<div class="value">' + money(score.profit) + '</div>' +
            '</div>' +
            '<div class="roi">' +
              '<div class="label">ROI</div>' +
              pct(score.roi) +
            '</div>' +
          '</div>' +
          '<div class="bar-block">' +
            '<div class="bar"><div class="bar-fill" style="width:' + paidShare + '%"></div></div>' +
            '<div class="bar-legend">' +
              '<span>pay <b>' + money(score.buyPrice) + '</b>' + (score.totalUnits > 1 ? '/unit' : '') + '</span>' +
              '<span>' + pct(score.discount) + ' under</span>' +
              '<span>worth <b>' + money(score.market) + '</b></span>' +
            '</div>' +
          '</div>' +
          '<dl class="facts">' +
            '<div class="fact"><dt>Total spend</dt><dd>' + money(score.investment) + '</dd></div>' +
            '<div class="fact"><dt>Units</dt><dd>' + score.totalUnits + '</dd></div>' +
            '<div class="fact"><dt>Condition</dt><dd>' + esc(listing.condition) + '</dd></div>' +
            '<div class="fact"><dt>Comps</dt><dd>n=' + score.sampleSize + '</dd></div>' +
            '<div class="fact"><dt>Seller</dt><dd>' + esc(String(seller.feedbackPercentage ?? '?')) + '%</dd></div>' +
            '<div class="fact"><dt>Feedback</dt><dd>' + esc(String(seller.feedbackScore ?? '?')) + '</dd></div>' +
          '</dl>' +
          (deal.risks && deal.risks.length
            ? '<div class="flags">' + deal.risks.map((r) => '<span class="flag">' + esc(r) + '</span>').join('') + '</div>'
            : '') +
          '<div class="actions">' +
            '<a class="open-btn" href="' + esc(listing.url) + '" target="_blank" rel="noopener noreferrer">Open on eBay</a>' +
            '<button class="ghost-btn dismiss-btn" type="button">' + (dismissed ? 'Restore' : 'Hide') + '</button>' +
          '</div>' +
        '</div>';

      el.querySelector('.dismiss-btn').addEventListener('click', () => setDismissed(deal.id, !dismissed));
      return el;
    }

    function renderState(kind) {
      const slot = $('state-slot');
      slot.innerHTML = '';
      if (!kind) return;

      const box = document.createElement('div');
      box.className = 'state';
      if (kind === 'offline') {
        box.innerHTML =
          '<h2>No scanner connected</h2>' +
          '<p>Open this page from the scanner with <code>node src/index.js serve</code> to see live results, ' +
          'or load a <code>deals.json</code> exported from a scan.</p>' +
          '<div class="state-actions">' +
            '<button class="ghost-btn" id="pick-file" type="button">Load deals.json</button>' +
            '<button class="ghost-btn" id="load-sample" type="button">See example listings</button>' +
          '</div>';
      } else if (kind === 'empty') {
        box.innerHTML =
          '<h2>Nothing clears your rules right now</h2>' +
          '<p>The scanner is running and found no listing at least 30% under market, ' +
          '$300+ in total spend, from a seller above 90% positive. That is the filter doing its job — ' +
          'most hours have no qualifying deal.</p>';
      } else if (kind === 'filtered') {
        box.innerHTML =
          '<h2>Nothing matches this filter</h2>' +
          '<p>There are qualifying deals, just not in this category. Switch back to All.</p>';
      }
      slot.appendChild(box);

      const pick = box.querySelector('#pick-file');
      if (pick) pick.addEventListener('click', () => $('file-input').click());
      const sample = box.querySelector('#load-sample');
      if (sample) sample.addEventListener('click', loadSample);
    }

    function render() {
      const grid = $('grid');
      grid.innerHTML = '';
      const list = visibleDeals();

      for (const deal of list) grid.appendChild(dealCard(deal));

      $('count').textContent = String(list.length);
      $('sample-note').dataset.on = String(state.sample);
      $('scan-time').textContent = state.live
        ? 'scanned ' + ago(state.lastScanAt)
        : (state.sample ? 'example data' : (state.deals.length ? 'from file · ' + ago(state.lastScanAt) : 'not connected'));

      const pulse = $('pulse');
      const stale = state.lastScanAt && Date.now() - state.lastScanAt > 3 * 3600 * 1000;
      pulse.dataset.stale = state.live ? String(Boolean(stale)) : 'offline';

      if (!state.deals.length) renderState(state.live ? 'empty' : 'offline');
      else if (!list.length) renderState('filtered');
      else renderState(null);
    }

    // ---- example data (clearly labelled, never passed off as live) ----------

    function loadSample() {
      const now = Date.now();
      state.deals = [
        {
          id: 'sample-1', foundAt: now - 22 * 60000,
          listing: {
            title: 'NVIDIA GeForce RTX 4080 16GB Founders Edition Graphics Card',
            url: 'https://www.ebay.com/sch/i.html?_nkw=rtx+4080', condition: 'Used',
            currency: 'USD', seller: { username: 'example_seller', feedbackScore: 1420, feedbackPercentage: 99.6 },
          },
          identity: { type: 'gpu', model: 'rtx 4080|16gb' },
          score: {
            buyPrice: 450, market: 727.5, profit: 159.52, roi: 0.354, discount: 0.381,
            investment: 450, totalUnits: 1, lotSize: 1, quantityAvailable: 1, sampleSize: 24,
          },
          risks: [],
        },
        {
          id: 'sample-2', foundAt: now - 64 * 60000,
          listing: {
            title: 'Corsair Vengeance 32GB (2x16GB) DDR5 6000MHz CL30 Desktop Memory',
            url: 'https://www.ebay.com/sch/i.html?_nkw=ddr5+32gb', condition: 'New',
            currency: 'USD', seller: { username: 'example_shop', feedbackScore: 8800, feedbackPercentage: 98.1 },
          },
          identity: { type: 'ram', model: 'ddr5|32gb|6000' },
          score: {
            buyPrice: 62, market: 152, profit: 214.4, roi: 0.692, discount: 0.592,
            investment: 310, totalUnits: 5, lotSize: 1, quantityAvailable: 5, sampleSize: 31,
          },
          risks: [],
        },
        {
          id: 'sample-3', foundAt: now - 3 * 3600000,
          listing: {
            title: 'AMD Ryzen 9 7950X3D 16-Core Processor AM5',
            url: 'https://www.ebay.com/sch/i.html?_nkw=ryzen+9+7950x3d', condition: 'Used',
            currency: 'USD', seller: { username: 'example_parts', feedbackScore: 41, feedbackPercentage: 92.5 },
          },
          identity: { type: 'cpu', model: 'ryzen 9 7950x3d' },
          score: {
            buyPrice: 330, market: 520, profit: 121.7, roi: 0.369, discount: 0.365,
            investment: 330, totalUnits: 1, lotSize: 1, quantityAvailable: 1, sampleSize: 12,
          },
          risks: ['auction — price can still climb'],
        },
      ];
      state.dismissed = {};
      state.lastScanAt = now - 22 * 60000;
      state.live = false;
      state.sample = true;
      render();
    }

    // ---- wiring ------------------------------------------------------------

    $('rules').innerHTML = RULES
      .map(([k, v]) => '<span class="rule">' + esc(k) + ' <b>' + esc(v) + '</b></span>')
      .join('');

    $('type-filter').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      state.type = btn.dataset.type;
      for (const b of $('type-filter').querySelectorAll('button')) {
        b.setAttribute('aria-pressed', String(b === btn));
      }
      render();
    });

    $('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });

    $('show-dismissed').addEventListener('click', (e) => {
      state.showDismissed = !state.showDismissed;
      e.currentTarget.setAttribute('aria-pressed', String(state.showDismissed));
      e.currentTarget.textContent = state.showDismissed ? 'Hide hidden' : 'Show hidden';
      render();
    });

    $('load-btn').addEventListener('click', () => $('file-input').click());

    $('file-input').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { adoptFile(JSON.parse(String(reader.result))); }
        catch (err) { alert('That file is not a deals.json the scanner produced.'); }
      };
      reader.readAsText(file);
    });

    // Live first; fall back to the file/sample view when no scanner answers.
    loadLive().then(render).catch(() => { loadSample(); });
    setInterval(() => { if (state.live) loadLive().then(render).catch(() => {}); }, 60000);
  })();
</script>
